<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Access</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: #f7f7f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    color: #1a1a1a;
  }

  .card {
    background: #ffffff;
    border-radius: 16px;
    border: 1px solid #e8e8e4;
    padding: 3rem 2.5rem;
    width: 100%;
    max-width: 420px;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 2.5rem;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    background: #1a1a1a;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-icon svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: #fff;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .logo-text {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #1a1a1a;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.3;
    color: #1a1a1a;
    margin-bottom: 0.5rem;
  }

  .subtitle {
    font-size: 14px;
    color: #888;
    margin-bottom: 2rem;
    line-height: 1.5;
  }

  .field {
    margin-bottom: 1.125rem;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #444;
    margin-bottom: 0.4rem;
    letter-spacing: 0.01em;
  }

  input {
    width: 100%;
    height: 42px;
    border: 1px solid #e0e0da;
    border-radius: 8px;
    padding: 0 12px;
    font-size: 15px;
    color: #1a1a1a;
    background: #fafaf8;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    font-family: inherit;
  }

  input:focus {
    border-color: #1a1a1a;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(26,26,26,0.07);
  }

  input::placeholder { color: #bbb; }

  .btn {
    width: 100%;
    height: 44px;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 0.5rem;
    font-family: inherit;
    letter-spacing: -0.01em;
    transition: background 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn:hover { background: #333; }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg {
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    color: #b91c1c;
    margin-top: 1rem;
    display: none;
    line-height: 1.5;
  }

  /* Success screen */
  .success-screen {
    display: none;
    text-align: center;
    padding: 1rem 0;
  }

  .success-icon {
    width: 56px;
    height: 56px;
    background: #f0fdf4;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.5rem;
    border: 1px solid #bbf7d0;
  }

  .success-icon svg {
    width: 26px;
    height: 26px;
    fill: none;
    stroke: #16a34a;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .success-screen h2 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 0.5rem;
  }

  .success-screen p {
    font-size: 14px;
    color: #888;
    line-height: 1.6;
  }

  .divider {
    border: none;
    border-top: 1px solid #f0f0ec;
    margin: 2rem 0;
  }

  .footer-note {
    font-size: 12px;
    color: #bbb;
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="card">

  <div class="logo-row">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24">
        <path d="M1.5 8.5C1.5 8.5 6 4 12 4s10.5 4.5 10.5 4.5"/>
        <path d="M5 12s2.5-3 7-3 7 3 7 3"/>
        <circle cx="12" cy="16" r="2"/>
      </svg>
    </div>
    <span class="logo-text">Guest Wi-Fi</span>
  </div>

  <!-- Form view -->
  <div id="form-view">
    <h1>Connect to the network</h1>
    <p class="subtitle">Enter your details to get online. Access is instant.</p>

    <div class="field">
      <label for="username">Name</label>
      <input type="text" id="username" name="username" placeholder="Your name" autocomplete="name" />
    </div>

    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
    </div>

    <button class="btn" id="submit-btn" onclick="handleSubmit()">
      <span id="btn-label">Get access</span>
      <div class="spinner" id="spinner"></div>
    </button>

    <div class="error-msg" id="error-msg"></div>
  </div>

  <!-- Success view -->
  <div class="success-screen" id="success-view">
    <div class="success-icon">
      <svg viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h2>You're connected</h2>
    <p>Welcome aboard! You now have access to the network.<br>Enjoy your session.</p>
  </div>

  <hr class="divider">
  <p class="footer-note">Your information is used only to grant network access<br>and will not be shared with third parties.</p>

</div>

<script>
  const ENDPOINT = "/register";

  async function handleSubmit() {
    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const errorEl = document.getElementById("error-msg");
    const btn = document.getElementById("submit-btn");
    const spinner = document.getElementById("spinner");
    const label = document.getElementById("btn-label");

    errorEl.style.display = "none";

    if (!username) return showError("Please enter your name.");
    if (!email || !email.includes("@")) return showError("Please enter a valid email address.");

    btn.disabled = true;
    spinner.style.display = "block";
    label.textContent = "Connecting…";

    try {
      const response = await fetch(ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ username, email })
      });

      if (!response.ok) {
        const text = await response.text();
        throw new Error("Server returned " + response.status + (text ? ": " + text : ""));
      }

      document.getElementById("form-view").style.display = "none";
      document.getElementById("success-view").style.display = "block";

    } catch (err) {
      showError("Could not connect. Please try again." + (err.message ? " (" + err.message + ")" : ""));
      btn.disabled = false;
      spinner.style.display = "none";
      label.textContent = "Get access";
    }
  }

  function showError(msg) {
    const el = document.getElementById("error-msg");
    el.textContent = msg;
    el.style.display = "block";
  }

  document.addEventListener("keydown", function(e) {
    if (e.key === "Enter") handleSubmit();
  });
</script>

</body>
</html>
